name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        shell: powershell
        run: |
            $ErrorActionPreference = 'Stop'
            $env:PYTHONPATH='backend'
            py -3.11 -m pytest backend/tests/test_core.py --tb=short -p no:cacheprovider
      - name: Test
        shell: powershell
        run: |
            $ErrorActionPreference = 'Stop'
            $env:PYTHONPATH='backend'
            py -3.11 -m pytest backend/tests --tb=short -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            py -3.11 -m app.health_server --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: powershell
        run: |
            $ErrorActionPreference = 'Stop'
            $env:PYTHONPATH='backend'
            py -3.11 -m compileall backend/app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            py -3.11 -m pytest backend/tests --tb=short -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
