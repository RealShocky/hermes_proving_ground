name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest backend/tests --tb=short -p no:cacheprovider

      - name: Healthcheck
        run: PYTHONPATH=backend python -m app.health_server --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build image
        run: docker build -t hermes-proving-ground:latest .

      - name: Start compose service
        run: docker compose up -d --wait app

      - name: Check service health
        run: docker compose ps app | grep -E "healthy"

      - name: Tear down
        run: docker compose down
